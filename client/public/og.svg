<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Pastel background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7E5"/>
      <stop offset="100%" stop-color="#F1E8FF"/>
    </linearGradient>
    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <!-- Crochet dotted pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e9d5ff" opacity="0.45"/>
    </pattern>
    <!-- Brand colors -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#dots)" opacity="0.4"/>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="80" y="110" rx="36" ry="36" width="1040" height="410" fill="rgba(255,255,255,0.78)"/>
  </g>

  <!-- Decorative butterfly -->
  <g transform="translate(860,150) scale(1.1)">
    <path d="M120 120c-30-40-75-55-95-35s-5 65 25 85c-30 5-55 30-50 55s45 30 75 10c-10 30 0 60 25 65s45-20 45-55c0 35 20 60 45 55s35-35 25-65c30 20 70 15 75-10s-20-50-50-55c30-20 45-65 25-85s-65-5-95 35c-10-15-30-15-40 0z" fill="url(#brand)" opacity="0.8"/>
    <circle cx="120" cy="120" r="6" fill="#4c1d95" opacity="0.6"/>
  </g>

  <!-- Crochet hook icon -->
  <g transform="translate(820,380)">
    <path d="M0 25c60-40 120-40 160-5 20 15 45 15 65-2 18-15 18-36 2-54" fill="none" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/>
    <path d="M223 0c10 0 19 9 19 19s-9 19-19 19-19-9-19-19 9-19 19-19z" fill="#7c3aed" opacity="0.85"/>
  </g>

  <!-- Brand text -->
  <g font-family="Marcellus, Georgia, serif" fill="#4c1d95">
    <text x="120" y="290" font-size="90" font-weight="400">ButterflyArt.sv</text>
  </g>
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial" fill="#374151">
    <text x="120" y="350" font-size="38">Crochet artesanal • Amigurumis • Accesorios</text>
    <text x="120" y="395" font-size="28" fill="#6b7280">Piezas hechas a mano y pedidos personalizados</text>
  </g>
</svg>
